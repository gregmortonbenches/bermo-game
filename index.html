<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>GTA Bermondsey</title>

<style>
/* VOICE: a cosy 2026 indie game: warm, kind, a little cheeky
   IDEA: a living pixel-art Bermondsey seen from above, like a modern HD-2D city sim
   PICTURE: the full-screen game world itself, real streets, real light from lamps and shop windows
   COLOUR and TYPE: dusk navy glass panels, warm sodium amber accent, heart pink; Pixelify Sans
   LAYOUT: full bleed world; HUD floats in the corners; thumb controls bottom; dialogue sheet slides up */
:root{color-scheme:dark;--glass:rgba(16,18,34,.72);--line:rgba(255,255,255,.14);--amber:#ffb85c;--pink:#ff6fa5;--ink:#f6f3ec}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#0c0e18;color:var(--ink);font:600 16px/1.35 'Pixelify Sans',system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#g{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.card{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);box-shadow:0 8px 24px rgba(0,0,0,.28)}
#hudL{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));padding:8px 12px 9px}
#cash{font-size:22px;font-weight:700;color:#9df08a;line-height:1}
#cash::before{content:'';display:inline-block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2a8,#e8b030 60%,#a8701a);margin-right:6px;vertical-align:1px}
#hearts{margin-top:5px;color:var(--pink);font-size:15px;letter-spacing:2px;line-height:1}
#hearts .off{color:rgba(255,255,255,.22)}
#hudR{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tin{padding:7px 10px 8px;width:150px}
.tin .lab{font-size:11px;color:#c8c6e0;letter-spacing:.5px;display:flex;justify-content:space-between}
.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.12);margin:5px 0 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#ffb85c,#ff6fa5);transition:width .6s}
#mmWrap{cursor:pointer;pointer-events:auto;position:relative;width:104px;height:104px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.7);box-shadow:0 8px 24px rgba(0,0,0,.35)}
#mm{width:100%;height:100%;display:block;image-rendering:pixelated}
.icons{display:flex;gap:8px;pointer-events:auto}
.ib{font:inherit;font-size:13px;color:var(--ink);min-width:48px;min-height:44px;padding:0 12px;border-radius:14px;cursor:pointer}
.ib:focus-visible,#dlg button:focus-visible,#title button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#obj{position:absolute;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);padding:7px 14px;font-size:14px;max-width:min(64vw,460px);text-align:center;border-color:rgba(255,184,92,.6)}
#obj b{color:var(--amber)}
#banner{position:absolute;left:0;right:0;top:60%;text-align:center;font-size:clamp(20px,5.4vw,34px);font-weight:700;font-style:italic;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:3px;color:#fff;opacity:0;transition:opacity .6s,transform .6s;transform:translateY(8px);text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 24px rgba(0,0,0,.4);letter-spacing:1px}
#banner.on{opacity:1;transform:none}
#street{position:absolute;left:calc(12px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));font-size:13px;color:#e8e6ff;text-shadow:0 1px 0 #000,0 0 8px rgba(0,0,0,.6);max-width:46vw}
#tag{position:absolute;left:0;top:0;padding:4px 9px;font-size:13px;white-space:nowrap;transform:translate(-50%,-100%);border-color:rgba(255,184,92,.7)}
#tag b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--amber);color:#1a1206;font-size:11px;margin-right:6px}
#toast{position:absolute;left:50%;bottom:calc(128px + env(safe-area-inset-bottom));transform:translate(-50%,10px);width:max-content;max-width:86vw;padding:9px 14px;font-size:15px;opacity:0;transition:opacity .25s,transform .25s;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#joyBase{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25)}
#joyKnob{position:absolute;left:37px;top:37px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 4px 12px rgba(0,0,0,.3)}
#btns{position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:14px;pointer-events:auto}
.rb{font:inherit;border-radius:50%;border:2px solid rgba(255,255,255,.35);color:#fff;cursor:pointer;touch-action:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#bA{width:78px;height:78px;background:rgba(255,184,92,.85);color:#2a1606;font-size:22px;font-weight:700;box-shadow:0 6px 18px rgba(255,150,60,.35)}
#musB.off{opacity:.6;text-decoration:line-through}
#bB,#bU,#bJ{width:58px;height:58px;background:rgba(16,18,34,.6);font-size:13px;margin-bottom:6px}#bU[hidden]{display:none}
.rb.on,.rb:active{transform:scale(.94)}
.fine #btns,.fine #joyBase{display:none!important}
.pre #hudL,.pre #hudR,.pre #btns,.pre #street{display:none!important}
#dlg{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,calc(100vw - 20px));max-height:72vh;overflow:auto;padding:16px 18px 10px;pointer-events:auto;border-radius:20px;background:rgba(18,20,40,.88);animation:up .22s ease-out}
@keyframes up{from{transform:translate(-50%,16px);opacity:0}}
#dlg .who{color:var(--amber);font-size:13px;letter-spacing:.6px}
#dlg .ttl{font-size:24px;font-weight:700;margin:4px 0 6px}
#dlg .txt{color:#e4e2f2;font-size:16px;font-weight:400;line-height:1.45}
#dlg .opts{display:flex;flex-direction:column;margin-top:10px;gap:6px}
#dlg button{font:inherit;font-size:16px;text-align:left;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;min-height:46px;padding:8px 14px;cursor:pointer}
#dlg button.sel{background:rgba(255,184,92,.2);border-color:rgba(255,184,92,.7)}
#dlg input{font:inherit;font-size:18px;width:9em;background:rgba(0,0,0,.35);color:var(--amber);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:8px 12px;text-transform:uppercase;letter-spacing:3px;min-height:46px;margin-top:8px;pointer-events:auto}
.mem{display:flex;gap:8px;align-items:baseline;border-top:1px solid rgba(255,255,255,.12);padding:8px 0;font-size:15px}
.mem .dot{color:#666}.mem .dot.on{color:#5be38a}
.code{font-size:30px;color:var(--amber);letter-spacing:4px;margin:4px 0}
#title{position:absolute;inset:0;pointer-events:auto;overflow:hidden;background:#1a1030}
#title .ph{position:absolute;inset:-2%;background:url(bg.jpg) 68% 50%/cover;filter:saturate(1.15) contrast(1.08);animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.06) translate(-1.5%,-1%)}}
#title .grade{position:absolute;inset:0;background:linear-gradient(170deg,#3a1a78 0%,#8a2a9a 38%,#e0507a 66%,#ffa05a 100%);mix-blend-mode:color;opacity:.78}
#title .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,12,60,.55) 0%,rgba(26,12,60,0) 34%,rgba(26,12,60,0) 58%,rgba(20,8,40,.82) 100%),radial-gradient(120% 80% at 70% 40%,rgba(255,120,160,.18),rgba(0,0,0,0) 60%)}
#title .logo{position:absolute;left:clamp(18px,6vw,64px);top:calc(clamp(28px,9vh,90px) + env(safe-area-inset-top));color:#fff;font-family:Rubik,system-ui,sans-serif;font-weight:900;text-transform:lowercase;line-height:.8;letter-spacing:-.02em;text-shadow:0 6px 30px rgba(40,10,80,.45)}
#title .logo .a{display:block;text-transform:uppercase;font-size:clamp(92px,30vw,200px)}
#title .logo .b{display:block;font-size:clamp(40px,12.4vw,86px);margin-top:.3em}
#title .logo .c{display:block;font-size:clamp(54px,17vw,116px);margin-top:.18em;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.92);letter-spacing:.02em;filter:drop-shadow(0 0 12px rgba(255,110,190,.6))}
#title .foot{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px}
#title button{font:inherit;font-family:Rubik,system-ui,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:2px;cursor:pointer}
#title #startB{font-size:17px;min-height:54px;min-width:220px;padding:0 30px;border-radius:999px;color:#2a0f40;background:#fff;border:0;box-shadow:0 0 0 3px rgba(255,255,255,.25),0 10px 30px rgba(255,90,170,.45)}
#title #startB:disabled{background:rgba(255,255,255,.25);color:#fff;box-shadow:none}
#title button:focus-visible{outline:2px solid #ffb85c;outline-offset:3px}
#title .spin{position:absolute;right:calc(20px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin 1s linear infinite}
#title.ready .spin{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (orientation:landscape){#title .logo .a{font-size:clamp(80px,22vh,180px)}#title .logo .b{font-size:clamp(34px,9.3vh,78px)}#title .logo .c{font-size:clamp(44px,12.6vh,104px)}#title .foot{align-items:flex-end;right:calc(64px + env(safe-area-inset-right));left:auto}}
@media (prefers-reduced-motion:reduce){#title .ph{animation:none}}
@media (max-width:420px){.tin{width:128px}#mmWrap{width:86px;height:86px}}
@media (prefers-reduced-motion:reduce){#dlg{animation:none}#banner,#toast{transition:none}}
#c3{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#g{display:none!important}body.big #g{display:block!important}
.stick{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.22);pointer-events:none;transition:opacity .2s;opacity:.55}
.stick.on{opacity:1;transition:none}.stick i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.5);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.stick b{position:absolute;left:0;right:0;top:-22px;text-align:center;font-size:11px;font-weight:600;color:rgba(255,255,255,.75);text-shadow:0 1px 3px #000}
#stL{left:calc(86px + env(safe-area-inset-left));top:calc(100% - 96px - env(safe-area-inset-bottom))}
#stR{left:calc(100% - 86px - env(safe-area-inset-right));top:calc(100% - 96px - env(safe-area-inset-bottom))}
.fine .stick,.pre .stick{display:none!important}
.big .stick{display:none!important}
#btns{bottom:calc(178px + env(safe-area-inset-bottom))!important}
@media (orientation:landscape){#btns{bottom:calc(22px + env(safe-area-inset-bottom))!important;right:calc(178px + env(safe-area-inset-right))!important}}
.fine #btns{display:none!important}
#street{left:50%!important;transform:translateX(-50%);text-align:center;bottom:calc(8px + env(safe-area-inset-bottom))!important;white-space:nowrap}
body.coarse #zoB,body.coarse #ziB{display:none}
</style>
